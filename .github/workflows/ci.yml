name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: schoolhealth_ci
          POSTGRES_USER: schoolhealth_ci
          POSTGRES_PASSWORD: schoolhealth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolhealth_ci -d schoolhealth_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect backend
        id: backend
        shell: bash
        run: |
          if [[ -f backend/requirements.txt ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Backend not added yet; skipping backend checks."
          fi

      - name: Set up Python
        if: steps.backend.outputs.available == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        if: steps.backend.outputs.available == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run pytest
        if: steps.backend.outputs.available == 'true'
        working-directory: backend
        run: |
          if [[ -d tests ]] && find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pytest -q tests
          else
            echo "No pytest tests found yet; skipping."
          fi

      - name: Run PostgreSQL Parent and Admin integration
        if: steps.backend.outputs.available == 'true'
        working-directory: backend
        env:
          RUN_POSTGRES_TESTS: "1"
          DATABASE_URL: postgresql+psycopg://schoolhealth_ci:schoolhealth_ci@localhost:5432/schoolhealth_ci
        run: python -m pytest -q tests/test_management_postgres.py

  frontend-checks:
    name: Frontend checks and Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect frontend and Playwright tests
        id: frontend
        shell: bash
        run: |
          if [[ -f frontend/package.json && -f frontend/package-lock.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Frontend package files not added yet; skipping frontend checks."
          fi

          if compgen -G 'frontend/playwright.config.*' > /dev/null && \
             [[ -d frontend/tests ]] && \
             find frontend/tests -type f \( -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.js' \) -print -quit | grep -q .; then
            echo "has_playwright_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_playwright_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.frontend.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: steps.frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm run --if-present lint

      - name: Type-check frontend
        if: steps.frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm run --if-present typecheck

      - name: Build frontend
        if: steps.frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm run --if-present build

      - name: Run frontend unit tests
        if: steps.frontend.outputs.available == 'true'
        working-directory: frontend
        run: npm test

      - name: Install Playwright Chromium
        if: steps.frontend.outputs.available == 'true' && steps.frontend.outputs.has_playwright_tests == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: steps.frontend.outputs.available == 'true' && steps.frontend.outputs.has_playwright_tests == 'true'
        working-directory: frontend
        run: npx playwright test
