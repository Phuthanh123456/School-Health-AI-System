services:
  - type: web
    name: schoolhealth-demo
    runtime: docker
    plan: free
    region: oregon
    branch: codex/render-demo
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schoolhealth-demo-db
          property: connectionString
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: SCHOOLHEALTH_DEMO_PASSWORD
        sync: false
      - key: LLM_BASE_URL
        value: https://ollama.com/v1
      - key: LLM_MODEL
        value: gpt-oss:20b
      - key: LLM_API_KEY
        sync: false

databases:
  - name: schoolhealth-demo-db
    plan: free
    region: oregon
    databaseName: schoolhealth
    user: schoolhealth
    ipAllowList: []
